
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<meta name="description" content="QCMH Toolbox 免费上班族工具箱：工资估算、加班费计算、工时记录和工资明细核对。">
<title>QCMH Toolbox - 上班族实用工具箱</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#202938;--muted:#6b7280;--line:#e5e9f0;--primary:#5265e8;--soft:#eef0ff;--green:#16845b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}
header{background:linear-gradient(135deg,#5265e8,#8274ee);color:white;padding:26px 18px 30px}
.top,.wrap{max-width:900px;margin:auto}
.brand{font-size:19px;font-weight:800;letter-spacing:.3px}
.hero h1{font-size:29px;line-height:1.3;margin:28px 0 10px}
.hero p{margin:0;color:#eef0ff;font-size:14px}
.search{width:100%;margin-top:22px;padding:14px 15px;border:0;border-radius:13px;font-size:16px;outline:none}
.wrap{padding:22px 15px 45px}
.section-title{font-size:19px;font-weight:800;margin:8px 0 13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px 15px;box-shadow:0 3px 12px #1d2b4d08}
.tool{cursor:pointer;text-align:left;color:var(--text);font:inherit;transition:transform .15s}
.tool:active{transform:scale(.98)}
.icon{display:flex;width:43px;height:43px;align-items:center;justify-content:center;background:var(--soft);border-radius:13px;font-size:23px;margin-bottom:10px}
.tool strong{display:block;font-size:15px}
.tool small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.panel{display:none;margin-top:22px}
.panel.active{display:block}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}
.panel h2{font-size:21px;margin:0}
.back{border:0;background:var(--soft);color:var(--primary);padding:8px 13px;border-radius:9px;font-size:14px}
label{display:block;font-size:13px;font-weight:650;margin:13px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1px solid #dce1ea;border-radius:10px;background:white;color:var(--text);font:inherit;font-size:15px;min-width:0}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;background:var(--primary);color:white;border-radius:10px;padding:12px 15px;font-size:15px;font-weight:700;cursor:pointer;margin-top:15px}
.btn.secondary{background:#edf0f6;color:#303849}
.result{background:#f0f2ff;border-radius:12px;padding:15px;margin-top:14px;overflow-wrap:anywhere}
.result strong.big{font-size:25px;color:#414fcb}
.note{font-size:12px;color:var(--muted);margin-top:10px}
footer{border-top:1px solid var(--line);padding:20px 5px;margin-top:28px;color:var(--muted);font-size:12px}
footer button{border:0;background:none;color:var(--primary);padding:0}
.item{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.item button{float:right;border:0;color:#c43c48;background:none}
@media(min-width:650px){header{padding:30px 25px 36px}.wrap{padding:28px 25px 50px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero h1{font-size:36px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">🧰 QCMH Toolbox</div>
    <div class="hero">
      <h1>让工作和生活，<br>计算得更明白。</h1>
      <p>免费实用工具 · 手机打开即用 · 无需注册</p>
    </div>
    <input class="search" id="search" placeholder="搜索工具，例如：加班、工资、工时" aria-label="搜索工具">
  </div>
</header>
<main class="wrap">
  <div id="home">
    <div class="section-title">实用工具</div>
    <div class="grid" id="tools">
      <button class="card tool" data-tool="salary"><span class="icon">💰</span><strong>工资计算器</strong><small>汇总工资、补贴与扣款</small></button>
      <button class="card tool" data-tool="overtime"><span class="icon">⏱️</span><strong>加班费估算</strong><small>估算不同类型加班收入</small></button>
      <button class="card tool" data-tool="hours"><span class="icon">📅</span><strong>工时记录器</strong><small>记录班次并汇总工时</small></button>
      <button class="card tool" data-tool="check"><span class="icon">🧾</span><strong>工资条核对</strong><small>核算收入、扣款与差额</small></button>
    </div>
    <div class="section-title" style="margin-top:28px">使用说明</div>
    <div class="card">
      <strong>你的数据，尽量留在你的设备上</strong>
      <p class="note">本页面的计算在浏览器中进行。工时记录保存在当前浏览器中，请定期导出备份。不要在公共设备上输入敏感个人信息。</p>
    </div>
  </div>

  <section class="panel" id="salary">
    <div class="panel-head"><h2>💰 工资计算器</h2><button class="back" data-back>返回工具箱</button></div>
    <div class="card">
      <label>基本工资（元）</label><input id="sBase" type="number" min="0" placeholder="例如 5000">
      <div class="row"><div><label>奖金及补贴（元）</label><input id="sBonus" type="number" min="0" value="0"></div><div><label>其他扣款（元）</label><input id="sDeduct" type="number" min="0" value="0"></div></div>
      <label>已知的社保、个税等扣款（元）</label><input id="sTax" type="number" min="0" value="0">
